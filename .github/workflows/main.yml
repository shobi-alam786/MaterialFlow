name: Diagnose cleanQty

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    name: Find duplicate cleanQty
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show commit
        run: |
          echo "=========================================="
          echo "CURRENT COMMIT"
          echo "=========================================="
          git rev-parse HEAD
          git status

      - name: Find cleanQty declarations
        run: |
          echo "=========================================="
          echo "ALL cleanQty DECLARATIONS"
          echo "=========================================="

          grep -RIn \
            --include="*.kt" \
            -E '(^|[^A-Za-z0-9_])fun[[:space:]]+cleanQty[[:space:]]*\(' \
            . || true

      - name: Find all cleanQty text
        run: |
          echo "=========================================="
          echo "ALL cleanQty REFERENCES"
          echo "=========================================="

          grep -RIn \
            --include="*.kt" \
            'cleanQty' \
            app/src || true

      - name: Find ReportsScreen files
        run: |
          echo "=========================================="
          echo "ALL ReportsScreen.kt FILES"
          echo "=========================================="

          find . -type f -name "ReportsScreen.kt" -print

      - name: Show ReportsScreen cleanQty area
        run: |
          echo "=========================================="
          echo "REPORTSSCREEN AROUND cleanQty"
          echo "=========================================="

          grep -n -B 10 -A 20 \
            'cleanQty' \
            app/src/main/java/com/example/ui/screens/ReportsScreen.kt || true

      - name: Find duplicate function signatures
        run: |
          echo "=========================================="
          echo "EVERY Kotlin FILE CONTAINING cleanQty"
          echo "=========================================="

          find . -type f -name "*.kt" -print0 |
          xargs -0 grep -nH \
            'fun cleanQty' || true

      - name: List source tree
        run: |
          echo "=========================================="
          echo "KOTLIN SOURCE TREE"
          echo "=========================================="

          find app/src -type f -name "*.kt" | sort
