name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Install Gradle 8.9 directly
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Check Java
      - name: Check Java
        run: java -version

      # 5. Check Gradle
      - name: Check Gradle
        run: gradle --version

      # 6. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaterialFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
